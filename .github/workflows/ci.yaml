name: ci
on:
    # définition des actions qui trigger les tests et les branches associées
    push:
        branches: [main, test]
    pull_request:
        branches: [main]
# permissions nécessaires de l'utilisateur pour déclencher des tests
permissions:
    contents: read
jobs:
    test:
        runs-on: ubuntu-latest
        defaults:
            run:
                # change le dossier d'éxecution des commandes
                working-directory: ./code
        steps:
            # instruction permettant de cloner le dépot sur la machine de test
            - uses: actions/checkout@v4
            # permet d'installer php en précisant sa version, ses extensions et désactive la couverture de code (comme pour des stats)
            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: mbstring, xml, ctype, iconv, intl
                  coverage: none
            # installe les package nécessaires pour un projet symfony, installe des version light et sans interaction utilisateur
            - run: composer install --prefer-dist --no-progress --no-interaction

            # utilisation de phpdocumentor pour la doc, trouvé sur le repo officiel
            - name: Generer doc
              uses: phpDocumentor/phpDocumentor@master
              with:
                  args: -d src/Entity build/docs


            - name: Push nouvelle doc
              run: |
                  git config --global user.email "github-actions[bot]@users.noreply.github.com"
                  git config --global user.name "github-actions[bot]"
                  git add docs/api
                  if ! git diff --staged --quiet; then
                    git commit -m "doc: màj de la doc"
                    git push
                  fi

            # lance les tests avec les commandes phpunit par défaut
            - name: Lancement des tests
              run: vendor/bin/phpunit tests/Entity/TestAvantCodeTest.php
